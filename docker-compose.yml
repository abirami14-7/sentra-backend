services:
  db:
    image: postgres:16-alpine
    container_name: sentra_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentra
      POSTGRES_PASSWORD: sentra
      POSTGRES_DB: sentra
    ports:
      - "5432:5432"
    volumes:
      - sentra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentra -d sentra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sentra_pgdata:
